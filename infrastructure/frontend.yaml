AWSTemplateFormatVersion: "2010-09-09"
Description: Secure StudyGrounds frontend hosting with private S3 and CloudFront.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  FrontendBucketName:
    Type: String
    Default: ""
    Description: Optional explicit S3 bucket name. Leave blank for the existing DEV stack.

  CertificateArn:
    Type: String
    Description: ACM certificate ARN in us-east-1 covering joinstudygrounds.com and www.joinstudygrounds.com.

  DomainName:
    Type: String
    Default: joinstudygrounds.com

  WwwDomainName:
    Type: String
    Default: ""

  ApiDomainName:
    Type: String
    Default: nxa9uz2cv0.execute-api.us-east-2.amazonaws.com
    Description: API Gateway hostname used for crawlable public note pages and the dynamic sitemap.

  CognitoDomainName:
    Type: String
    Default: us-east-2sz3qwdfwv.auth.us-east-2.amazoncognito.com
    Description: Cognito hosted UI hostname allowed by the frontend CSP.

Conditions:
  HasWwwDomain: !Not [!Equals [!Ref WwwDomainName, ""]]
  HasExplicitFrontendBucketName: !Not [!Equals [!Ref FrontendBucketName, ""]]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If [HasExplicitFrontendBucketName, !Ref FrontendBucketName, !Ref "AWS::NoValue"]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: CloudFront access to the private StudyGrounds frontend bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: Security headers for StudyGrounds.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self';
              style-src 'self';
              img-src 'self' data: blob: https://s3.us-east-2.amazonaws.com https://*.s3.us-east-2.amazonaws.com;
              connect-src 'self' https://${ApiDomainName} https://${CognitoDomainName} https://s3.us-east-2.amazonaws.com https://*.s3.us-east-2.amazonaws.com;
              frame-src 'self' blob: https://s3.us-east-2.amazonaws.com https://*.s3.us-east-2.amazonaws.com;
              object-src 'none';
              base-uri 'self';
              frame-ancestors 'none';
              form-action 'self';
              upgrade-insecure-requests
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true

  SeoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-public-seo"
        Comment: Short-lived cache for public note HTML and sitemap responses.
        DefaultTTL: 300
        MaxTTL: 600
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  CanonicalHostRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-canonical-host"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www.joinstudygrounds.com to the canonical apex domain.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host && request.headers.host.value;

          if (host === '${WwwDomainName}') {
            var query = request.querystring || {};
            var pairs = [];

            Object.keys(query).forEach(function (key) {
              var item = query[key];
              if (item.multiValue && item.multiValue.length) {
                item.multiValue.forEach(function (value) {
                  pairs.push(encodeURIComponent(key) + '=' + encodeURIComponent(value.value));
                });
              } else if (item.value !== undefined) {
                pairs.push(encodeURIComponent(key) + '=' + encodeURIComponent(item.value));
              }
            });

            var location = 'https://${DomainName}' + request.uri;
            if (pairs.length) {
              location += '?' + pairs.join('&');
            }

            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: location },
                'cache-control': { value: 'public, max-age=3600' }
              }
            };
          }

          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "StudyGrounds ${EnvironmentName} frontend"
        Aliases:
          - !Ref DomainName
          - !If [HasWwwDomain, !Ref WwwDomainName, !Ref "AWS::NoValue"]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
          - Id: PublicSeoApiOrigin
            DomainName: !Ref ApiDomainName
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        CacheBehaviors:
          - PathPattern: "notes/*"
            TargetOriginId: PublicSeoApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: !Ref SeoCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref FrontendResponseHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt CanonicalHostRedirectFunction.FunctionARN
          - PathPattern: "sitemap.xml"
            TargetOriginId: PublicSeoApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: !Ref SeoCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref FrontendResponseHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt CanonicalHostRedirectFunction.FunctionARN
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref FrontendResponseHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CanonicalHostRedirectFunction.FunctionARN
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  FrontendBucketName:
    Description: Private S3 bucket for frontend assets.
    Value: !Ref FrontendBucket

  CloudFrontDistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref FrontendDistribution

  CloudFrontDomainName:
    Description: Point Cloudflare CNAME records to this hostname.
    Value: !GetAtt FrontendDistribution.DomainName

  SiteUrl:
    Value: !Sub "https://${DomainName}"
