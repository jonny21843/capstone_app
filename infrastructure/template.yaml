AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless API foundation for the Notes App.

Parameters:
  CognitoUserPoolId:
    Type: String
    Default: us-east-2_sZ3qWdfwv

  CognitoAppClientId:
    Type: String
    Default: 3t79knetd0pdav5jsso0osfb1e

  CloudFrontOrigin:
    Type: String
    Default: https://d84l1y8p4kdic.cloudfront.net
    Description: Legacy saved deploy parameter; not used during localhost development.

Resources:
  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: noteId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: noteId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: NoteIdIndex
          KeySchema:
            - AttributeName: noteId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  NotesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - http://localhost:8080
            AllowedMethods:
              - PUT
              - POST
              - GET
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 300

  NotesApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:8080
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}"
              audience:
                - !Ref CognitoAppClientId
        DefaultAuthorizer: CognitoJwtAuthorizer

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/me/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Events:
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/me
            Method: GET
            PayloadFormatVersion: "2.0"

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/profile/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminUpdateUserAttributes
              Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
      Events:
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/profile
            Method: GET
            PayloadFormatVersion: "2.0"
        UpdateProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/profile
            Method: PATCH
            PayloadFormatVersion: "2.0"

  CreateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/create/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref NotesTable
      Events:
        CreateNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes
            Method: POST
            PayloadFormatVersion: "2.0"

  UpdateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/update/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref NotesTable
      Events:
        UpdateNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}
            Method: PATCH
            PayloadFormatVersion: "2.0"

  ListNotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/list/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NotesTable
      Events:
        ListNotes:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes
            Method: GET
            PayloadFormatVersion: "2.0"

  CreateUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/upload/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          NOTES_BUCKET: !Ref NotesBucket
          MAX_FILE_BYTES: 20971520
          MAX_FILES_PER_NOTE: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NotesTable
        - S3WritePolicy:
            BucketName: !Ref NotesBucket
      Events:
        CreateUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}/upload
            Method: POST
            PayloadFormatVersion: "2.0"

  RegisterFileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/files/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          NOTES_BUCKET: !Ref NotesBucket
          MAX_FILE_BYTES: 20971520
          MAX_FILES_PER_NOTE: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - S3CrudPolicy:
            BucketName: !Ref NotesBucket
      Events:
        RegisterFile:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}/files
            Method: POST
            PayloadFormatVersion: "2.0"
        UpdateFile:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}/files/{fileId}
            Method: PATCH
            PayloadFormatVersion: "2.0"

  DeleteSourceFileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/delete_file/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          NOTES_BUCKET: !Ref NotesBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - S3CrudPolicy:
            BucketName: !Ref NotesBucket
      Events:
        DeleteSourceFile:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}/files/{fileId}
            Method: DELETE
            PayloadFormatVersion: "2.0"

  DeleteNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/delete/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          NOTES_BUCKET: !Ref NotesBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - S3CrudPolicy:
            BucketName: !Ref NotesBucket
      Events:
        DeleteNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}
            Method: DELETE
            PayloadFormatVersion: "2.0"

  PublishNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/notes/publish/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
              Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
      Events:
        PublishNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/notes/{noteId}/publish
            Method: PATCH
            PayloadFormatVersion: "2.0"

  PublicNotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/public/list/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NotesTable
      Events:
        PublicNotes:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/public/notes
            Method: GET
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: NONE

  PublicNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/public/get/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
          NOTES_BUCKET: !Ref NotesBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
        - S3ReadPolicy:
            BucketName: !Ref NotesBucket
      Events:
        PublicNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /api/public/notes/{noteId}
            Method: GET
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: NONE

Outputs:
  ApiBaseUrl:
    Description: Base URL for the Notes App HTTP API.
    Value: !Sub "https://${NotesApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"

  NotesTableName:
    Description: DynamoDB table used for user-owned note metadata.
    Value: !Ref NotesTable

  NotesBucketName:
    Description: Private S3 bucket used for note source files.
    Value: !Ref NotesBucket
