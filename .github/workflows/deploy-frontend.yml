name: Deploy StudyGrounds frontend

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cognito-auth
    paths:
      - "index.html"
      - "styles.css"
      - "config.js"
      - "auth.js"
      - "notes.js"
      - "tabs.js"
      - "auth/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: studygrounds-production-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy frontend to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          TOKEN="$token" python - <<'PY'
          import base64
          import json
          import os

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("sub", "aud", "repository", "environment", "ref", "job_workflow_ref"):
              if key in claims:
                  print(f"{key}={claims[key]}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build static deployment directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/auth
          cp index.html styles.css config.js auth.js notes.js tabs.js dist/
          cp auth/*.html auth/*.js dist/auth/

      - name: Sync frontend to S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync dist/ s3://studygrounds-frontend-frontendbucket-5jnigqnmskgt/ \
            --delete \
            --cache-control "public,max-age=300"

      - name: Prevent HTML and config caching
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp dist/index.html s3://studygrounds-frontend-frontendbucket-5jnigqnmskgt/index.html \
            --content-type "text/html" \
            --cache-control "no-cache,no-store,must-revalidate"
          aws s3 cp dist/config.js s3://studygrounds-frontend-frontendbucket-5jnigqnmskgt/config.js \
            --content-type "application/javascript" \
            --cache-control "no-cache,no-store,must-revalidate"
          aws s3 cp dist/auth/callback.html s3://studygrounds-frontend-frontendbucket-5jnigqnmskgt/auth/callback.html \
            --content-type "text/html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1O78RFI5U6N8S \
            --paths "/*"
